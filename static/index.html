<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP читалка</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <section id="library">
    <header class="bar">
      <h1>Бібліотека</h1>
      <select id="root-filter" aria-label="Тека"><option value="">Усі теки</option></select>
      <input id="filter" type="search" placeholder="Пошук книги…" autocomplete="off">
    </header>
    <p id="library-status" class="muted">Завантаження…</p>
    <ul id="book-list"></ul>
  </section>

  <section id="reader" hidden>
    <header class="bar">
      <button id="back" title="До бібліотеки (Esc)">←</button>
      <h1 id="book-title"></h1>
      <span id="position" class="muted"></span>
    </header>

    <div id="stage">
      <div class="guide top"><span class="notch"></span></div>
      <div id="word" aria-live="off"><span class="l"></span><span class="p"></span><span class="r"></span></div>
      <div class="guide bottom"><span class="notch"></span></div>
      <div id="wpm-label" class="muted"></div>
    </div>

    <div id="context" hidden></div>
    <p id="reader-status" class="muted" hidden></p>
    <div id="ocr-panel" hidden>
      <button id="ocr-start">Розпізнати текст (OCR)</button>
      <progress id="ocr-progress" max="1" value="0" hidden></progress>
      <span id="ocr-text" class="muted"></span>
    </div>

    <footer id="controls">
      <input id="progress" type="range" min="0" value="0" step="1" aria-label="Позиція в книзі">
      <div class="row">
        <div class="group nav">
          <button id="page-prev" title="Попередня сторінка (PageUp)">⏪ стор</button>
          <button id="prev" title="Попереднє речення (←)">⏮ реч</button>
          <button id="word-prev" title="Попереднє слово (Shift+←)">◀ сл</button>
          <button id="play" class="play" title="Пуск / пауза (Пробіл)">▶</button>
          <button id="word-next" title="Наступне слово (Shift+→)">сл ▶</button>
          <button id="next" title="Наступне речення (→)">реч ⏭</button>
          <button id="page-next" title="Наступна сторінка (PageDown)">стор ⏩</button>
        </div>
        <div class="group">
          <span class="muted">Швидкість</span>
          <button id="wpm-down" title="Повільніше (↓)">−</button>
          <input id="wpm" type="number" min="100" max="1000" step="25" value="300" aria-label="Слів за хвилину">
          <button id="wpm-up" title="Швидше (↑)">+</button>
          <span class="muted">сл/хв</span>
        </div>
        <div class="group">
          <span class="muted">Розмір</span>
          <button id="font-down" title="Менший шрифт (−)">A−</button>
          <input id="font" type="number" min="24" max="120" step="4" aria-label="Розмір слова, px">
          <button id="font-up" title="Більший шрифт (+)">A+</button>
          <span class="muted">px</span>
        </div>
      </div>
      <p class="muted keys">Пробіл — пуск/пауза · ← → — речення · Shift+← → — слово · PageUp/PageDown — сторінка · ↑ ↓ — швидкість · + − — розмір · Esc — бібліотека</p>
    </footer>
  </section>
</body>
</html>
